[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openclip"
version = "0.1.0"
description = "Transforme des vidéos YouTube en clips verticaux 30-60 s et les publie sur TikTok / YouTube Shorts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.10",
  "yt-dlp>=2026.10.26",
  "faster-whisper>=1.2",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
face = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8"]

[project.scripts]
openclip = "openclip.cli:main"

[tool.setuptools.packages.find]
include = ["openclip*"]

[tool.setuptools.package-data]
openclip = ["web/static/*"]
